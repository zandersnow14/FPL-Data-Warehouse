name: ci

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    lint:
        name: Lint & Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v4
            
            - name: Install dependencies
              run: uv sync
            
            - name: Run ruff linter
              run: uv run ruff check .
